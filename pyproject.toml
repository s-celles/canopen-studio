[project]
name = "canopen-studio"
version = "0.2.1"
description = "Universal CAN & CANopen protocol analyzer, telemetry plotter, and transmit station"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Sébastien Celles" }
]
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "canopen>=2.4.1",
    "matplotlib>=3.10.9",
    "pyserial>=3.5",
    "python-can>=4.4.0",
    "msgpack>=1.0.8",
    "fastmcp>=2.0",
    "a2a-sdk>=0.2",
    "fastapi[standard]>=0.115",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.11.2",
    "bandit>=1.7.9",
    "safety>=3.2.7",
    "pre-commit>=3.8.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # Ignore line-length violations for long comments / strings


[project.scripts]
canopen-studio = "can_gui:main"
can-sniffer = "can_sniffer:main"
canopen-mcp = "can_mcp_server:main"
canopen-a2a = "can_a2a_server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["can_gui", "can_sniffer", "can_interfaces", "can_bridge", "can_mcp_server", "can_a2a_server", "updater"]
packages = ["canopen_stack", "canopen_stack.decoders"]

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["attr-defined", "valid-type", "assignment", "operator", "no-any-return", "union-attr"]

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "matplotlib.*",
    "serial.*",
    "can.*"
]
ignore_missing_imports = true
ignore_errors = true
