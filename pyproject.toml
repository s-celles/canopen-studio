[project]
name = "canopen-studio"
# Declared once in src/canopen_studio/__init__.py and read from there (see tool.setuptools.dynamic).
dynamic = ["version"]
description = "Universal CAN & CANopen protocol analyzer, telemetry plotter, and transmit station"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Sébastien Celles" }
]
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "canopen>=2.4.1",
    "matplotlib>=3.10.9",
    "pyserial>=3.5",
    "python-can>=4.4.0",
    "msgpack>=1.0.8",
    "fastmcp>=2.0",
    "a2a-sdk>=0.2",
    "fastapi[standard]>=0.115",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Importing manufacturer signal definitions from a DBC database. Optional because the
# generic J1979 profile, and every profile written by hand, works without it.
dbc = ["cantools>=39.0"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.11.2",
    "bandit>=1.7.9",
    "safety>=3.2.7",
    "pre-commit>=3.8.0",
    # Exercises the optional DBC importer in CI; the package itself does not need it.
    "cantools>=39.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # Ignore line-length violations for long comments / strings


[project.scripts]
canopen-studio = "canopen_studio.gui:main"
can-sniffer = "canopen_studio.sniffer:main"
canopen-mcp = "canopen_studio.mcp_server:main"
canopen-a2a = "canopen_studio.a2a_server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = [
    "canopen_studio",
    "canopen_studio.stack",
    "canopen_studio.stack.decoders",
    "canopen_studio.diag",
    "canopen_studio.diag.elm327",
    "canopen_studio.diag.j1979",
    "canopen_studio.diag.profiles",
    "canopen_studio.diag.profiles.importers",
]

[tool.setuptools.package-data]
# Declarative PID tables and vehicle profiles ship with the package.
"canopen_studio.diag.profiles" = ["data/*.yaml", "data/**/*.yaml"]

[tool.setuptools.dynamic]
version = { attr = "canopen_studio.__version__" }

[tool.pytest.ini_options]
markers = [
    # Integration tests against Ircama's ELM327-emulator. Skipped unless it is installed,
    # which is opt-in because of its CC-BY-NC-SA-4.0 licence:
    #   uv run --with ELM327-emulator pytest -m emulator
    "emulator: needs Ircama's ELM327-emulator, which is not a dev dependency",
]

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["attr-defined", "valid-type", "assignment", "operator", "no-any-return", "union-attr"]

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "matplotlib.*",
    "serial.*",
    "can.*"
]
ignore_missing_imports = true
ignore_errors = true
