[project]
name = "canopen-studio"
# Declared once in src/canopen_studio/__init__.py and read from there (see tool.setuptools.dynamic).
dynamic = ["version"]
description = "Universal CAN & CANopen protocol analyzer, telemetry plotter, and transmit station"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Sébastien Celles" }
]
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "canopen>=2.4.1",
    "matplotlib>=3.10.9",
    "pyserial>=3.5",
    "python-can>=4.4.0",
    "msgpack>=1.0.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Importing manufacturer signal definitions from a DBC database. Optional because the
# generic J1979 profile, and every profile written by hand, works without it.
dbc = ["cantools>=39.0"]
# The MCP and A2A servers, which let an agent drive the analyser. Optional because
# `gui.py` already imports them inside a `try`/`except ImportError` and runs with
# `_SERVERS_AVAILABLE = False` when they are absent — nothing on a bench needs an
# agent. They are also the heavy half of an installation: together they pull
# cryptography, pydantic-core, beartype, pygments and the google namespace, which
# is what took a deployed copy from 33 MB to 61 MB.
servers = [
    "fastmcp>=2.0",
    "a2a-sdk>=0.2",
    "fastapi[standard]>=0.115",
]

[tool.uv.sources]
# Not on PyPI — the repository is private — so naming the source is what lets
# `uv pip install --group dev` resolve it. uv's own field: other tools ignore
# it, and it appears in nothing built from this project.
simple-apps-deployment = { git = "https://github.com/s-celles/simple-apps-deployment.git" }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.11.2",
    "bandit>=1.7.9",
    "safety>=3.2.7",
    "pre-commit>=3.8.0",
    # Exercises the optional DBC importer in CI; the package itself does not need it.
    "cantools>=39.0",
    # The publishing tool, used by `scripts/bundle_app.py` and by nothing the
    # studio runs: the deployed application never imports the platform, it is
    # merely started by it. A floor of 1.8.0 because that is the release whose
    # `lib/` the archive now relies on for matplotlib.
    "simple-apps-deployment>=1.8",
    # Same reason: the MCP and A2A servers moved to the `servers` extra, and their
    # tests must still run. A deployed copy leaves them out.
    "fastmcp>=2.0",
    "a2a-sdk>=0.2",
    "fastapi[standard]>=0.115",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.format]
# marimo rewrites a notebook with its own formatting every time it is saved,
# so the formatter would fight it line by line. Linting still applies.
exclude = ["notebooks/**"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # Ignore line-length violations for long comments / strings


[project.scripts]
canopen-studio = "canopen_studio.gui:main"
can-sniffer = "canopen_studio.sniffer:main"
canopen-mcp = "canopen_studio.mcp_server:main"
canopen-a2a = "canopen_studio.a2a_server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = [
    "canopen_studio",
    "canopen_studio.stack",
    "canopen_studio.stack.decoders",
    "canopen_studio.diag",
    "canopen_studio.diag.elm327",
    "canopen_studio.diag.j1979",
    "canopen_studio.diag.profiles",
    "canopen_studio.diag.profiles.importers",
]

[tool.setuptools.package-data]
# Declarative PID tables and vehicle profiles ship with the package.
"canopen_studio.diag.profiles" = ["data/*.yaml", "data/**/*.yaml"]

[tool.setuptools.dynamic]
version = { attr = "canopen_studio.__version__" }

[tool.pytest.ini_options]
markers = [
    # Integration tests against Ircama's ELM327-emulator. Skipped unless it is installed,
    # which is opt-in because of its CC-BY-NC-SA-4.0 licence:
    #   uv run --with ELM327-emulator pytest -m emulator
    "emulator: needs Ircama's ELM327-emulator, which is not a dev dependency",
]

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["attr-defined", "valid-type", "assignment", "operator", "no-any-return", "union-attr"]

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "matplotlib.*",
    "serial.*",
    "can.*"
]
ignore_missing_imports = true
ignore_errors = true
