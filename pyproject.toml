[project]
name = "canopen-studio"
version = "0.2.0"
description = "Universal CAN & CANopen protocol analyzer, telemetry plotter, and transmit station"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Sébastien Celles" }
]
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "canopen>=2.4.1",
    "matplotlib>=3.10.9",
    "pyserial>=3.5",
    "python-can>=4.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # Ignore line-length violations for long comments / strings


[project.scripts]
canopen-studio = "can_gui:main"
can-sniffer = "can_sniffer:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["can_gui", "can_sniffer", "can_interfaces", "updater"]
packages = ["canopen_stack", "canopen_stack.decoders"]
