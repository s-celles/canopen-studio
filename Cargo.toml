[workspace]
resolver = "2"
members = [
    "crates/canopen-core",
    "crates/canopen-cli",
    "crates/canopen-gui", "crates/canopen-gui",
]

[workspace.package]
version = "0.2.2"
edition = "2021"
authors = ["Sébastien Celles <s.celles@gmail.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/s-celles/canopen-studio"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
rmp-serde = "1.3"
socket2 = { version = "0.5", features = ["all"] }
crossbeam-channel = "0.5"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
