[workspace]
resolver = "3"
members = [
    "crates/canopen-core",
    "crates/canopen-cli",
    "crates/canopen-gui",
]

[workspace.package]
# Keep in step with canopen_studio.__version__, which the release workflow
# reads to version the installer. tests/test_version_consistency.py enforces it.
version = "0.6.0"
edition = "2024"
authors = ["Sébastien Celles <s.celles@gmail.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/s-celles/canopen-studio"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
rmp-serde = "1.3"
socket2 = { version = "0.5", features = ["all"] }
crossbeam-channel = "0.5"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
# default-features = false keeps libudev off the Linux build, so CI needs no
# extra system package; port enumeration falls back to scanning /dev and /sys.
serialport = { version = "4.7", default-features = false }
