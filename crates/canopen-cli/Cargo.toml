[package]
name = "canopen-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "High-performance CLI sniffer, latency monitor, and benchmark tool"

[[bin]]
name = "canopen-cli"
path = "src/main.rs"

# Wireshark runs an extcap as its own executable, with extcap's flags at the
# top level, so this cannot be a subcommand of canopen-cli.
[[bin]]
name = "canopen-extcap"
path = "src/bin/canopen-extcap.rs"

[dependencies]
canopen-core = { path = "../canopen-core" }
clap = { workspace = true }
