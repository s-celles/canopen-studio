[package]
name = "canopen-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "High-performance compiled CANopen, CAN, and OBD-II engine"

[lib]
name = "canopen_core"
crate-type = ["lib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
serde = { workspace = true }
serde_bytes = { workspace = true }
rmp-serde = { workspace = true }
socket2 = { workspace = true }
crossbeam-channel = { workspace = true }
thiserror = { workspace = true }
pyo3 = { version = "0.23", features = ["extension-module"], optional = true }

# Wireshark connects to a named pipe rather than creating one, so a live
# capture on Windows means being the pipe server. Unix gets the same
# rendezvous from mkfifo and needs nothing here.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
    # CreateNamedPipeW's signature reaches into these: the access flags live in
    # FileSystem, SECURITY_ATTRIBUTES in Security, OVERLAPPED in System::IO.
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
] }

[dev-dependencies]
