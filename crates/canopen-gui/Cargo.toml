[package]
name = "canopen-gui"
version.workspace = true
# Held at 2021 while the rest of the workspace is on 2024. build.rs has
# Slint generate a .rs file that is include!d here, so it compiles under
# this crate's edition, and `cargo fix --edition` reports 42 drop-order
# changes inside that generated code and in vtable/i-slint-core. None are
# in code written here. Revisit once Slint validates its codegen for 2024.
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
canopen-core = { path = "../canopen-core" }
slint = "1.18.0"

[build-dependencies]
slint-build = "1.18.0"
