repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Must match the ruff the project resolves, or the hook and
    # `ruff format --check` in CI disagree about the same files.
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: [ types-requests, types-setuptools, types-PyYAML ]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: [ "-r", ".", "-x", "./tests,./.venv", "-s", "B101,B110,B112,B310,B404,B603,B606,B607" ]
        pass_filenames: false
        additional_dependencies: [ "bandit[toml]" ]

  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        language: system
        entry: cargo fmt --all --
        types: [ rust ]
        pass_filenames: false

      - id: clippy
        name: clippy
        language: system
        # canopen-gui requires fontconfig (nix-shell only); full workspace is checked in CI
        entry: cargo clippy -p canopen-core -p canopen-cli --all-targets -- -D warnings
        types: [ rust ]
        pass_filenames: false
