name: Build and Publish Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            os_name: Windows
          - os: macos-latest
            os_name: macOS
          - os: ubuntu-latest
            os_name: Linux

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libxcb-xinerama0

      - name: Install dependencies
        run: uv sync

      - name: Generate application icons
        run: uv run --with pillow python scripts/generate_icon.py

      - name: Build standalone application with PyInstaller
        run: uv run --with pyinstaller python scripts/build_exe.py --clean

      - name: Build Portable Archive (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist/CANopen-Studio/* -DestinationPath dist/CANopen-Studio-Windows-x64-Portable.zip -Force

      - name: Build Portable Archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cd dist
          if [ -d "CANopen-Studio.app" ]; then tar -czvf CANopen-Studio-${{ matrix.os_name }}-x64-Portable.tar.gz CANopen-Studio.app/; else tar -czvf CANopen-Studio-${{ matrix.os_name }}-x64-Portable.tar.gz CANopen-Studio/; fi

      - name: Install Inno Setup and Compile (Windows Only)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install innosetup --no-progress
          $cmd = Get-Command iscc -ErrorAction SilentlyContinue
          if ($cmd) {
            $iscc = $cmd.Source
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          } else {
            Write-Error "ISCC.exe was not found."
            exit 1
          }
          & $iscc installer/CANopenStudio.iss

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*-Setup.exe
            dist/*-Portable.zip
            dist/*-Portable.tar.gz
          generate_release_notes: true
