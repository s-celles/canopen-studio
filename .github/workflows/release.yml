name: Build and Publish Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            os_name: Windows
          - os: macos-latest
            os_name: macOS
          - os: ubuntu-latest
            os_name: Linux

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libxcb-xinerama0 libfontconfig1-dev pkg-config

      - name: Install dependencies
        run: uv sync

      # Without this the published binaries ship with no canopen_core at all.
      # uv sync cannot produce it — the build backend is plain setuptools and the
      # Rust workspace sits beside it — and PyInstaller can only bundle what is
      # already in the package. UdpBus and CanopenLayer would fall back to Python
      # and merely lose the speed, but IsoTpReassembler re-raises the ImportError,
      # so the OBD-II tab would fail on first use in a released build.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build the canopen_core Python extension
        run: uv run python scripts/build_extension.py

      - name: Generate application icons
        run: uv run --with pillow python scripts/generate_icon.py

      - name: Build standalone application with PyInstaller
        run: uv run --with pyinstaller python scripts/build_exe.py --clean

      # 0.5.0 announces a native front end that nothing was shipping: the
      # packaging built only src/canopen_studio/gui.py. This must run after
      # PyInstaller, which wipes dist/ with --clean.
      - name: Build the native front end
        run: cargo build --release -p canopen-gui

      - name: Add the native front end to the bundle
        shell: bash
        run: |
          exe=canopen-gui
          [ "$RUNNER_OS" = "Windows" ] && exe=canopen-gui.exe
          cp "target/release/$exe" "dist/CANopen-Studio/$exe"
          ls -l "dist/CANopen-Studio/$exe"

      - name: Build Portable Archive (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist/CANopen-Studio/* -DestinationPath dist/CANopen-Studio-Windows-x64-Portable.zip -Force

      - name: Build Portable Archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cd dist
          if [ -d "CANopen-Studio.app" ]; then tar -czvf CANopen-Studio-${{ matrix.os_name }}-x64-Portable.tar.gz CANopen-Studio.app/; else tar -czvf CANopen-Studio-${{ matrix.os_name }}-x64-Portable.tar.gz CANopen-Studio/; fi

      - name: Install Inno Setup and Compile (Windows Only)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install innosetup --no-progress
          $cmd = Get-Command iscc -ErrorAction SilentlyContinue
          if ($cmd) {
            $iscc = $cmd.Source
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          } else {
            Write-Error "ISCC.exe was not found."
            exit 1
          }
          $version = (uv run python -c "import canopen_studio; print(canopen_studio.__version__)").Trim()
          Write-Host "Building installer for version $version"
          & $iscc /DMyAppVersion=$version installer/CANopenStudio.iss

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*-Setup.exe
            dist/*-Portable.zip
            dist/*-Portable.tar.gz
          generate_release_notes: true
