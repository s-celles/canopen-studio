name: Build and Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Generate application icons
        run: uv run --with pillow python scripts/generate_icon.py

      - name: Build standalone application with PyInstaller
        run: uv run --with pyinstaller python scripts/build_exe.py --clean

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Compile Inno Setup Installer
        shell: powershell
        run: |
          $cmd = Get-Command iscc -ErrorAction SilentlyContinue
          if ($cmd) {
            $iscc = $cmd.Source
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          } else {
            Write-Error "ISCC.exe (Inno Setup Compiler) was not found."
            exit 1
          }
          Write-Host "Compiling installer using: $iscc"
          & $iscc installer/CANopenStudio.iss

      - name: Create Portable Zip
        run: |
          Compress-Archive -Path dist/CANopen-Studio/* -DestinationPath dist/CANopen-Studio-Windows-x64-Portable.zip -Force

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*-Setup.exe
            dist/*-Portable.zip
          generate_release_notes: true
