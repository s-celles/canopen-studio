name: CI (Code Quality & Tests)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Code Quality & Style (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Check code formatting (ruff format)
        run: uv run ruff format --check .

      - name: Lint codebase (ruff check)
        run: uv run ruff check .

      - name: Static Type Checking (mypy)
        run: uv run mypy .

      # The exclusions need the ./ prefix: with `-r .` bandit sees ./.venv/...,
      # which bare `.venv` does not match, so it was scanning every installed
      # dependency and failing on PIL. B110 and B112 are skipped because this
      # codebase uses try/except/pass deliberately — a bus that is already gone
      # is not a reason to fail closing a session — and the individual B104
      # sites carry a `# nosec` with their reason.
      - name: Security Linting (bandit)
        run: uv run bandit -r . -x ./tests,./.venv -s B101,B110,B112,B310,B404,B603,B606,B607

      - name: Dependency Vulnerability Check (safety)
        run: uv run safety check || true  # Using true to prevent failing on upstream vulns unless explicitly configured

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files

  rust:
    name: Rust (clippy + fmt + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system dependencies
        run: sudo apt-get install -y libfontconfig1-dev pkg-config

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting (rustfmt)
        run: cargo fmt --check

      - name: Lint (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  test:
    name: Tests on Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      # uv sync cannot produce this: the build backend is plain setuptools and
      # the Rust workspace sits beside it. Without the compiled canopen_core,
      # every test that reaches ISO-TP, the CANopen layer or the virtual
      # simulator fails on the import alone.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The cache key covers the OS, the architecture and the lockfiles, but not
      # the interpreter. All four Python jobs on a runner would share one target/
      # directory, including the cached PyO3 build-script output that carries the
      # interpreter-specific link arguments: a target/ built under 3.13 then asks
      # the 3.10 job's linker for python313.lib, which it does not have (LNK1181
      # on Windows). PYO3_PYTHON does not save us — build_extension.py sets it to
      # the venv path, which is the same string in every job, so cargo sees no
      # change and reuses the stale output.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: py${{ matrix.python-version }}

      - name: Build the canopen_core Python extension
        run: uv run python scripts/build_extension.py

      - name: Run pytest test suite
        run: uv run pytest -v
