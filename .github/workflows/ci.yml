name: CI (Code Quality & Tests)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Code Quality & Style (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Check code formatting (ruff format)
        run: uv run ruff format --check .

      - name: Lint codebase (ruff check)
        run: uv run ruff check .

      - name: Static Type Checking (mypy)
        run: uv run mypy .

      - name: Security Linting (bandit)
        run: uv run bandit -r . -x tests,.venv -s B101,B310,B404,B603,B606,B607

      - name: Dependency Vulnerability Check (safety)
        run: uv run safety check || true  # Using true to prevent failing on upstream vulns unless explicitly configured

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files

  test:
    name: Tests on Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run pytest test suite
        run: uv run pytest -v
