# Generic SAE J1979 / ISO 15031-5 profile.
#
# The fallback every vehicle resolves to, and the base every other profile extends. It
# describes only what the standard legislates, so it is correct on any OBD-II compliant
# vehicle and never claims a manufacturer-specific meaning.
#
# Formulas use the byte letters of the standard's own worked examples: A is the first
# data byte after the PID echo, B the second, and so on.
#
# Which of these a given car actually implements is never assumed — it is discovered at
# runtime from the supported-PID bitmasks (PID 0x00, 0x20, 0x40 …), and this table only
# says how to decode a PID once the car has said it has it.

id: j1979_base
name: Generic SAE J1979
description: >-
  The legislated OBD-II parameters, common to every compliant vehicle.
  Used as the fallback when no more specific profile matches.

