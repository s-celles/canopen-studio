site_name: CAN & CANopen Studio
site_description: Universal CAN & CANopen protocol analyzer, telemetry plotter, and transmit station
site_author: Sébastien Celles
site_url: https://s-celles.github.io/canopen-studio/
repo_url: https://github.com/s-celles/canopen-studio
repo_name: s-celles/canopen-studio

theme:
  name: material
  palette:
    - scheme: slate
      primary: cyan
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: cyan
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  # Defining this section replaces MkDocs' default, so search has to be listed again.
  - search
  # Publishes /llms.txt (an index) and /llms-full.txt (every page, concatenated) so that
  # a language model can read this documentation without scraping the rendered HTML.
  - llmstxt:
      markdown_description: >-
        Universal CAN and CANopen protocol analyzer, real-time telemetry oscilloscope and
        transmit station, with OBD-II (SAE J1979) vehicle diagnostics over an ELM327 or a
        native CAN adapter. Supports SLCAN, PCAN, Kvaser, Vector, IXXAT, gs_usb,
        SocketCAN, UDP multicast and a hardware-free virtual simulator, and exposes the
        bus to AI agents over MCP and A2A.
      full_output: llms-full.txt
      sections:
        Getting started:
          - index.md
          - installation.md
          - quickstart.md
        Hardware and protocols:
          - hardware.md
          - decoders.md
          - logic_analyzer.md
        Architecture and performance:
          - architecture.md
          - rust_core.md
          - cli.md
          - benchmarks.md
        Analysis and transmission:
          - telemetry.md
          - transmission.md
          - sdo_nmt.md
          - wireshark.md
        Vehicle diagnostics:
          - obd.md
        Automation:
          - ai_integration.md
          - updates.md
        Project:
          - roadmap.md
          - changelog.md

markdown_extensions:
  - admonition
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # ROADMAP.md, benchmarks.md and CHANGELOG.md stay at the repository root, where
  # GitHub and the README expect them, and are pulled into the site from there.
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
  - tables
  - attr_list

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick Start: quickstart.md
  - Hardware & Interfaces: hardware.md
  - Protocol Stack & Decoders: decoders.md
  - Logic Analyzer & Signals: logic_analyzer.md
  - Architecture: architecture.md
  - Native Engine & Front End: rust_core.md
  - Command-Line Tools: cli.md
  - Telemetry & Oscilloscope: telemetry.md
  - Transmission Console: transmission.md
  - SDO & NMT Master: sdo_nmt.md
  - Wireshark Integration: wireshark.md
  - OBD-II Vehicle Diagnostics: obd.md
  - AI Integration (MCP & A2A): ai_integration.md
  - Screenshots Gallery: gallery.md
  - In-App Updates: updates.md
  - Performance Benchmarks: benchmarks.md
  - Roadmap: roadmap.md
  - Changelog: changelog.md
